name: CI

# O frontend nao e dockerizado: so se valida (dependencias, tipos, lint, testes, build e segredos).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  quality:
    name: Dependencias, tipos, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:ci
      - name: Build de producao
        # So as NEXT_PUBLIC_* sao necessarias no build; SESSION_SECRET so e lido em runtime. Fontes locais (fontsource).
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.test/api/v1
          NEXT_PUBLIC_APP_URL: https://app.example.test

  secret-scan:
    # Binario oficial via Docker: a gitleaks-action exige licenca em organizacoes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --verbose
