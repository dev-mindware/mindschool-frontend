name: CodeQL (semanal)
# Analise estatica fora do caminho critico do CI. Em repositorios privados exige GitHub Advanced Security
# (Settings > Code security); sem isso este workflow falha sem bloquear mais nada.
on:
  schedule: [{ cron: '0 4 * * 0' }]
  workflow_dispatch:

permissions: { contents: read, security-events: write }

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
